# @claude on an issue or PR: Claude builds from a Build issue, or addresses review comments
# and pushes fixes. Everything it writes lands on a branch / PR behind branch protection.
#
# Thin caller — yours to edit. The triggers below are repo-specific; the body is the standard and
# lives in _claude.yml, including the mention test and the tools the agent is allowed. In a
# consumer repo replace the `uses:` line with the pinned form:
#   uses: kayshn/poc-sdlc-template/.github/workflows/_claude.yml@v1.0.0
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# A called workflow can only narrow these, never widen them, so they are declared here.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: kayshn/poc-sdlc-template/.github/workflows/_claude.yml@v2.0.0
    secrets: inherit
