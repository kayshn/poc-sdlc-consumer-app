# Invariant — part of the AI-native SDLC standard. Pulled by tag; do not edit in a consumer repo.
# The triggers live in the caller, .github/workflows/ci.yml.
#
# The Makefile is the only seam to a project's stack: this workflow shells out to `make` and does
# nothing else. GitHub's ubuntu runners preinstall python3, node, jq, awk and yq, so `make install`
# can provision whatever the project needs without a setup step here.
name: CI (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the test job.
        type: string
        default: ubuntu-latest

jobs:
  test:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6

      - run: make install

      - name: Check the SDLC flow declaration
        run: make flow-check
      - name: Check conformance to the SDLC template
        run: make template-check
      - name: Lint
        shell: bash
        run: make lint 2>&1 | tee -a ci.log
      - name: Test
        shell: bash
        run: make test 2>&1 | tee -a ci.log

      # Stage 5 play: Claude as a read-only judgment step in the pipeline.
      - name: Triage failed build
        if: failure() && github.event_name == 'pull_request'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || { echo "No Claude token (fork PR?); skipping triage"; exit 0; }
          npm install -g @anthropic-ai/claude-code
          claude -p "Read the CI log at ci.log and the files it points to. Identify the most likely
          cause, say whether the failure looks flaky or real, and write a summary of at most five
          lines for the PR thread. Output only the summary." \
            --allowedTools "Read,Grep,Glob" > triage.md
          { echo "### CI triage (Claude)"; cat triage.md; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
