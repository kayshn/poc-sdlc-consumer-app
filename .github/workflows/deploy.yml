# Stage 5: a green CI run on main deploys to production. Add required reviewers (release manager)
# to the "production" environment to make this a human gate: the agent can prepare the release
# but cannot pass the gate.
#
# Thin caller — yours to edit. The triggers below are repo-specific; the body is the standard and
# lives in _deploy.yml. In a consumer repo replace the `uses:` line with the pinned form:
#   uses: kayshn/poc-sdlc-template/.github/workflows/_deploy.yml@v1.0.0
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
