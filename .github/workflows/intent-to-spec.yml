# Stage 1 -> 2: an accepted (merged) intent.md triggers the requirements-and-design pass.
# Claude writes .sdlc/specs/<slug>.md; a deterministic step opens it as a PR.
# The approval mode comes from stages.design.gate.approval in .sdlc/flow.yaml:
#   auto   - the pipeline (not Claude) marks the spec `Status: approved (auto)` and auto-merges the PR
#            once `test` is green. The human gate moves to the Build issue: nothing is built until
#            someone comments @claude there, and the spec can be rejected at that point.
#   manual - the product owner resolves concerns, sets `Status: approved` and merges.
# Anything other than `auto` is treated as manual.
name: Intent to spec

on:
  push:
    branches: [main]
    paths: [".sdlc/intent/**.md", "!.sdlc/intent/_TEMPLATE.md"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Intent slug to (re)generate a spec for, e.g. 000-first-feature"
        required: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: intent-to-spec

jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SDLC_BOT_TOKEN || github.token }}

      - name: Find intents without a spec
        id: find
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          if [ -n "$INPUT_SLUG" ]; then
            files=".sdlc/intent/$INPUT_SLUG.md"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files=$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r HEAD -- .sdlc/intent/)
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- .sdlc/intent/)
          fi
          slugs=""
          for f in $files; do
            slug=$(basename "$f" .md)
            [ "$slug" = "_TEMPLATE" ] && continue
            if [ -z "$INPUT_SLUG" ] && [ -f ".sdlc/specs/$slug.md" ]; then
              echo ".sdlc/specs/$slug.md exists; skipping"; continue
            fi
            slugs="$slugs $slug"
          done
          echo "slugs=$(echo $slugs)" >> "$GITHUB_OUTPUT"
          echo "Intents to spec: ${slugs:-none}"

      # yq (mikefarah) is preinstalled on GitHub's Ubuntu runners.
      - name: Read spec approval mode from .sdlc/flow.yaml
        id: flow
        run: |
          approval=$(yq '.stages.design.gate.approval' .sdlc/flow.yaml)
          [ "$approval" = "auto" ] || approval=manual
          echo "approval=$approval" >> "$GITHUB_OUTPUT"
          echo "Spec approval: $approval"

      # Uses the CLI rather than claude-code-action, which does not support `push` events.
      - name: Claude writes the spec
        if: steps.find.outputs.slugs != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLUGS: ${{ steps.find.outputs.slugs }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Intent slugs: $SLUGS

          For each slug, read .sdlc/intent/<slug>.md and produce a requirements and design spec for
          integrating it into this codebase. Use the write-spec skill and apply every policy
          skill that is relevant (secure-api-review for any endpoint change).
          Write the result to .sdlc/specs/<slug>.md. Describe clearly any areas of concern, especially
          where you cannot satisfy contradicting policies.
          Only create or edit files under .sdlc/specs/. Do not commit." \
            --allowedTools "Read,Glob,Grep,Skill,Write,Edit" \
            --permission-mode acceptEdits \
            --max-turns 40
          for s in $SLUGS; do
            [ -s ".sdlc/specs/$s.md" ] || { echo "::error::Claude did not write .sdlc/specs/$s.md"; exit 1; }
          done

      - name: Mark specs auto-approved
        if: steps.find.outputs.slugs != '' && steps.flow.outputs.approval == 'auto'
        env:
          SLUGS: ${{ steps.find.outputs.slugs }}
        run: |
          for s in $SLUGS; do
            sed -i -E '2s/Status: [a-z ()|]+$/Status: approved (auto)/' ".sdlc/specs/$s.md"
            grep -q "Status: approved (auto)" ".sdlc/specs/$s.md" \
              || { echo "::error::Could not set Status on .sdlc/specs/$s.md (line 2 must end with 'Status: <value>')"; exit 1; }
          done

      - name: Open spec PR
        id: pr
        if: steps.find.outputs.slugs != ''
        env:
          GH_TOKEN: ${{ secrets.SDLC_BOT_TOKEN || github.token }}
          SLUGS: ${{ steps.find.outputs.slugs }}
          AUTO: ${{ steps.flow.outputs.approval == 'auto' }}
        run: |
          branch="spec/$(echo $SLUGS | tr ' ' '-')-${{ github.run_id }}"
          {
            echo "Generated by Claude from: $(for s in $SLUGS; do printf '.sdlc/intent/%s.md ' "$s"; done)"
            echo
            if [ "$AUTO" = "true" ]; then
              echo "**Auto-approved.** The pipeline set \`Status: approved (auto)\` and this PR merges itself once \`test\` passes."
              echo "Review happens on the *Build* issue that opens after the merge: nothing is built until someone comments \`@claude\` there."
              echo "To stop it now, disable auto-merge on this PR or close it."
            else
              echo "**Product owner checklist**"
              echo "- [ ] Spec solves the stated problem; open questions answered or carried forward"
              echo "- [ ] Each *Area of concern* resolved with its policy owner"
              echo "- [ ] Higher-risk change? Tech lead consulted"
              echo "- [ ] Set \`Status: approved\` in the spec, then merge. Merging starts the Build stage."
            fi
          } > pr-body.md
          # --unless per slug: if another run already landed the spec on main, this one bows out
          # rather than opening a pull request that can never merge.
          unless=()
          for s in $SLUGS; do unless+=(--unless ".sdlc/specs/$s.md"); done
          ./.sdlc/scripts/open_pr.sh "${unless[@]}" "$branch" "spec: $SLUGS" pr-body.md .sdlc/specs/
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Approve as github-actions[bot] (needs "Allow GitHub Actions to create and approve pull requests"),
      # then enable auto-merge as the bot token so the merge to main triggers spec-to-build.yml.
      # Without SDLC_BOT_TOKEN the PR author is github-actions[bot], which cannot approve its own PR,
      # so the PR is left for a human.
      - name: Approve and auto-merge spec PR
        if: steps.find.outputs.slugs != '' && steps.flow.outputs.approval == 'auto'
        env:
          BOT_TOKEN: ${{ secrets.SDLC_BOT_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::warning::SDLC_BOT_TOKEN is not set; leaving the spec PR for manual approval."; exit 0
          fi
          GH_TOKEN=$BOT_TOKEN gh pr view "$BRANCH" --json number >/dev/null 2>&1 || { echo "No spec PR opened; nothing to approve"; exit 0; }
          GH_TOKEN=$ACTIONS_TOKEN gh pr review "$BRANCH" --approve --body "Auto-approved by the pipeline (.sdlc/flow.yaml: design approval auto). Review on the Build issue."
          GH_TOKEN=$BOT_TOKEN gh pr merge "$BRANCH" --auto --squash --delete-branch
