# Stage 1 -> 2: an accepted (merged) intent.md triggers the requirements-and-design pass.
# Claude writes .sdlc/specs/<slug>.md; a deterministic step opens it as a PR.
#
# Thin caller — yours to edit. The triggers below are repo-specific; the body is the standard and
# lives in _intent-to-spec.yml. In a consumer repo replace the `uses:` line with the pinned form:
#   uses: kayshn/poc-sdlc-template/.github/workflows/_intent-to-spec.yml@v1.0.0
name: Intent to spec

on:
  push:
    branches: [main]
    paths: [".sdlc/intent/**.md", "!.sdlc/intent/_TEMPLATE.md"]
  workflow_dispatch:
    inputs:
      slug:
        description: "Intent slug to (re)generate a spec for, e.g. 000-first-feature"
        required: true

# A called workflow can only narrow these, never widen them, so they are declared here.
permissions:
  contents: write
  pull-requests: write
  id-token: write

# Belt and braces. open_pr.sh --unless is what actually settles a race; this stops two pushes in
# quick succession paying an agent twice to write the same spec.
concurrency: intent-to-spec

jobs:
  spec:
    uses: kayshn/poc-sdlc-template/.github/workflows/_intent-to-spec.yml@v2.2.0
    with:
      slug: ${{ inputs.slug }}
    secrets: inherit
