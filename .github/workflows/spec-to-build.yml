# Stage 2 -> 3: an approved (merged, Status: approved) spec opens a Build issue for the owning engineer.
#
# Thin caller — yours to edit. The triggers below are repo-specific; the body is the standard and
# lives in _spec-to-build.yml. In a consumer repo replace the `uses:` line with the pinned form:
#   uses: kayshn/poc-sdlc-template/.github/workflows/_spec-to-build.yml@v1.0.0
name: Spec to build

on:
  push:
    branches: [main]
    paths: [".sdlc/specs/**.md", "!.sdlc/specs/_TEMPLATE.md"]

# A called workflow can only narrow these, never widen them, so they are declared here.
permissions:
  contents: read
  issues: write

jobs:
  handoff:
    uses: kayshn/poc-sdlc-template/.github/workflows/_spec-to-build.yml@v2.3.0
    secrets: inherit
