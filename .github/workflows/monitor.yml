# Stage 6: closing the loop. Detection is a deterministic script; the agent is only invoked when a
# control band is breached, and .sdlc/monitoring/bands.json decides what it may do.
#
# Thin caller — yours to edit. The schedule below is repo-specific; the body is the standard and
# lives in _monitor.yml. In a consumer repo replace the `uses:` line with the pinned form:
#   uses: kayshn/poc-sdlc-template/.github/workflows/_monitor.yml@v1.0.0
name: Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      inject:
        description: "Synthetic latest value to simulate a breach (e.g. 0.052 for 2σ, 0.2 for 3σ)"
        required: false

# A called workflow can only narrow these, never widen them, so they are declared here.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  monitor:
    uses: kayshn/poc-sdlc-template/.github/workflows/_monitor.yml@v2.2.0
    with:
      inject: ${{ inputs.inject }}
    secrets: inherit
